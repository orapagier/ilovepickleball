name: Nightly database backup

# 17:00 UTC is 01:00 in Asia/Manila — after the courts close, before anyone
# books again, so a dump never lands mid-transaction on a busy evening.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Before the secrets are configured this workflow would fail nightly and
      # mail about it, so an unconfigured repo skips instead of failing.
      - name: Check configuration
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GOOGLE_OAUTH_REFRESH_TOKEN" ]; then
            echo "Secrets not set — see docs/backups-and-calendar.md. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      # Runners ship an older client than Neon runs, and pg_dump refuses to
      # dump a server newer than itself. Uses PostgreSQL's own repo script
      # rather than hand-rolled apt lines, which silently left v16 in place.
      - name: Install PostgreSQL 17 client
        if: steps.check.outputs.ready == 'true'
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # Assert rather than trust: the wrapper on PATH resolves to whichever
          # major it likes, and a silent v16 is exactly what broke this before.
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump database
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # pipefail matters more than it looks: without it the pipeline below
          # reports gzip's status, and gzip succeeds on the empty output of a
          # failed pg_dump — producing a green run and a 20-byte "backup".
          set -eo pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          FILE="smash-zone-${STAMP}.sql.gz"
          # --no-owner/--no-acl keep the dump restorable into any database,
          # not just one with Neon's exact role names.
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-acl "$DATABASE_URL" | gzip -9 > "$FILE"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Verify the dump is real
        if: steps.check.outputs.ready == 'true'
        run: |
          set -eo pipefail
          gunzip -c "$BACKUP_FILE" > /tmp/check.sql
          SIZE=$(stat -c%s /tmp/check.sql)
          echo "uncompressed: ${SIZE} bytes"
          if ! grep -q "PostgreSQL database dump" /tmp/check.sql; then
            echo "::error::Dump has no pg_dump header — refusing to upload it."
            exit 1
          fi
          if ! grep -q 'CREATE TABLE public."Booking"' /tmp/check.sql; then
            echo "::error::Dump has no Booking table — refusing to upload it."
            exit 1
          fi
          echo "tables: $(grep -c '^CREATE TABLE' /tmp/check.sql)"
          rm /tmp/check.sql

      - name: Upload to Google Drive
        if: steps.check.outputs.ready == 'true'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BACKUP_RETENTION_DAYS: "30"
        run: node scripts/backup-to-drive.mjs "$BACKUP_FILE"
